<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>ChatTube</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,sans-serif;background:#0b1020;color:#e8e8f5}
header{display:flex;gap:12px;align-items:center;padding:14px 16px;border-bottom:1px solid #1e2440;flex-wrap:wrap}
.logo{font-weight:800;font-size:22px}.logo span{color:#8b6cff}
input,textarea,select{background:#111830;border:1px solid #232b4d;color:#fff;border-radius:8px;padding:10px;font-size:15px;width:100%}
header input{flex:1;min-width:160px}
main{padding:16px;max-width:1000px;margin:auto}
.cats{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}
.cats button{background:#111830;color:#ccd;border:1px solid #232b4d;border-radius:20px;padding:6px 14px;cursor:pointer}
.cats button.on{background:#7c5cff;color:#fff;border-color:#7c5cff}
.grille{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.carte{background:#111830;border:1px solid #1e2440;border-radius:10px;overflow:hidden;padding-bottom:10px}
.carte img{width:100%;height:130px;object-fit:cover;background:#1a2040}
.carte h3{margin:8px 10px 2px;font-size:15px}
.prix{color:#a58bff;font-weight:700;margin:0 10px}
.desc{margin:4px 10px;font-size:12px;color:#9aa}
.btn,.carte button{background:#7c5cff;color:#fff;border:0;border-radius:8px;padding:10px 14px;cursor:pointer;font-size:14px}
.carte button{width:calc(100% - 20px);margin:6px 10px 0}
.gris{background:#232b4d}
.rouge{background:#a33}
.ligne{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid #1e2440}
.ligne button{background:#232b4d;color:#fff;border:0;border-radius:6px;width:28px;height:28px}
#btnPanier{position:fixed;bottom:14px;right:14px;box-shadow:0 4px 16px #0008;padding:12px 16px}
.total{display:flex;justify-content:space-between;font-size:18px;font-weight:700;margin:14px 0}
label{display:block;margin:12px 0 4px;font-size:14px}
.box{background:#111830;border:1px solid #1e2440;border-radius:10px;padding:12px;margin:10px 0}
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.box input,.box select,.box textarea{margin:4px 0 10px}
small{color:#9aa}
[hidden]{display:none!important}
</style>
</head>
<body>
<header>
  <div class="logo">Chat<span>Tube</span></div>
  <input id="q" placeholder="Rechercher une impression...">
</header>

<main>
  <!-- CATALOGUE -->
  <section id="catalogue">
    <h1>Catalogue</h1>
    <div class="cats" id="cats"></div>
    <div class="grille" id="grille">Chargement...</div>
  </section>

  <!-- COMMANDE -->
  <section id="commande" hidden>
    <h1>Votre commande</h1>
    <div id="lignes"></div>
    <div class="total"><span>Total</span><span id="totalEl">0 €</span></div>
    <label>Votre nom *</label>
    <input id="nom" placeholder="Ex : Lucas Dupont">
    <label>Votre message (optionnel)</label>
    <textarea id="msg" rows="3" placeholder="Couleur, taille, etc."></textarea>
    <p style="font-size:13px;color:#9aa">Le paiement se fait en main propre à la remise de la commande.</p>
    <button class="btn" id="envoyer">Envoyer ma commande</button>
    <button class="btn gris" id="retour">Retour au catalogue</button>
  </section>

  <!-- MERCI -->
  <section id="merci" hidden style="text-align:center;padding-top:40px">
    <div style="font-size:60px">✅</div>
    <h1>Commande envoyée !</h1>
    <p>Merci ! Je m'en occupe dès que possible.</p>
    <button class="btn" id="retour2">Retour au catalogue</button>
  </section>

  <!-- ADMIN -->
  <section id="admin" hidden>
    <h1>Espace admin</h1>
    <div id="login" hidden>
      <input id="email" type="email" placeholder="Email" style="margin-bottom:10px">
      <input id="mdp" type="password" placeholder="Mot de passe" style="margin-bottom:10px">
      <button class="btn" id="connexion">Se connecter</button>
    </div>
    <div id="panel" hidden>
      <h2>Ajouter un modèle</h2>
      <div class="box">
        <input id="pnom" placeholder="Nom">
        <input id="pprix" type="number" step="0.01" placeholder="Prix (€)">
        <select id="pcat">
          <option>Figurines</option><option>Décoration</option><option>Utilité</option>
          <option>Jeux & Divertissement</option><option>Autres</option>
        </select>
        <textarea id="pdesc" rows="2" placeholder="Description"></textarea>
        <input id="photo" type="file" accept="image/*">
        <button class="btn" id="ajouter">Publier</button>
      </div>
      <h2>Commandes</h2>
      <div id="commandes">Chargement...</div>
      <h2>Mes modèles</h2>
      <div id="liste"></div>
      <button class="btn gris" id="deco">Se déconnecter</button>
    </div>
  </section>
</main>

<button class="btn" id="btnPanier">🛒 Panier</button>

<script>
const SUPABASE_URL = "https://XXXX.supabase.co";
const SUPABASE_KEY = "TA_CLE_ANON";
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const CATS = ["Tous","Figurines","Décoration","Utilité","Jeux & Divertissement","Autres"];
let produits = [], cat = "Tous", panier = JSON.parse(localStorage.getItem("panier") || "[]");

/* ---------- Navigation ---------- */
function show(v){
  ["catalogue","commande","merci","admin"].forEach(id => $(id).hidden = id !== v);
  $("btnPanier").hidden = v !== "catalogue";
  document.querySelector("header").hidden = v === "admin";
  window.scrollTo(0,0);
}

/* ---------- Boutique ---------- */
function afficherCats(){
  $("cats").innerHTML = CATS.map(c => `<button data-cat="${esc(c)}" class="${c===cat?"on":""}">${esc(c)}</button>`).join("");
}
function afficher(){
  const q = $("q").value.toLowerCase();
  const liste = produits.filter(p => (cat==="Tous" || p.categorie===cat) && (p.nom+" "+(p.description||"")).toLowerCase().includes(q));
  $("grille").innerHTML = liste.map(p => `
    <div class="carte">
      <img src="${esc(p.image_url)}" alt="">
      <h3>${esc(p.nom)}</h3>
      <p class="prix">${Number(p.prix).toFixed(2)} €</p>
      <p class="desc">${esc(p.description)}</p>
      <button data-add="${p.id}">Ajouter au panier</button>
    </div>`).join("") || "<p>Aucun résultat.</p>";
}
const total = () => panier.reduce((s,l) => s + l.prix*l.qty, 0);
function sauver(){ localStorage.setItem("panier", JSON.stringify(panier)); majPanier(); }
function majPanier(){
  $("btnPanier").textContent = `🛒 Panier (${panier.reduce((s,l)=>s+l.qty,0)}) · ${total().toFixed(2)} €`;
  $("lignes").innerHTML = panier.map(l => `
    <div class="ligne"><span>${esc(l.nom)}</span>
    <span><button data-moins="${l.id}">−</button> ${l.qty} <button data-plus="${l.id}">+</button></span>
    <b>${(l.prix*l.qty).toFixed(2)} €</b></div>`).join("") || "<p>Panier vide.</p>";
  $("totalEl").textContent = total().toFixed(2) + " €";
}
function changer(id, d){
  const l = panier.find(x => x.id == id); if(!l) return;
  l.qty += d; if(l.qty <= 0) panier = panier.filter(x => x.id != id);
  sauver();
}
async function envoyer(){
  const nom = $("nom").value.trim();
  if(!nom || !panier.length){ alert("Ajoute un produit et ton nom."); return; }
  const { error } = await db.from("commandes").insert({ nom_client: nom, message: $("msg").value.trim(), items: panier, total: total() });
  if(error){ alert("Erreur, réessaie."); return; }
  panier = []; sauver(); $("msg").value = ""; show("merci");
}
async function charger(){
  const { data, error } = await db.from("produits").select("*").order("created_at", { ascending:false });
  if(error){ $("grille").textContent = "Erreur de chargement."; return; }
  produits = data; afficher();
}

/* ---------- Admin ---------- */
async function ouvrirAdmin(){
  show("admin");
  const { data:{ session } } = await db.auth.getSession();
  $("login").hidden = !!session;
  $("panel").hidden = !session;
  if(session){ chargerCommandes(); chargerProduits(); }
}
async function chargerProduits(){
  const { data } = await db.from("produits").select("*").order("created_at", { ascending:false });
  $("liste").innerHTML = (data||[]).map(p => `
    <div class="box row"><span>${esc(p.nom)} · ${Number(p.prix).toFixed(2)} €</span>
    <button class="btn rouge" data-del="${p.id}">Supprimer</button></div>`).join("");
}
async function chargerCommandes(){
  const { data, error } = await db.from("commandes").select("*").order("created_at", { ascending:false });
  if(error){ $("commandes").textContent = "Erreur (vérifie ton email dans les policies SQL)."; return; }
  $("commandes").innerHTML = data.map(c => `
    <div class="box">
      <div class="row"><b>${esc(c.nom_client)}</b><b>${Number(c.total).toFixed(2)} €</b></div>
      <small>${new Date(c.created_at).toLocaleString("fr-FR")}</small>
      <div style="margin:8px 0">${c.items.map(i => `${i.qty} × ${esc(i.nom)}`).join("<br>")}</div>
      ${c.message ? `<p><i>${esc(c.message)}</i></p>` : ""}
      <select data-statut="${c.id}">
        ${["nouvelle","en impression","prête","remise"].map(s => `<option ${s===c.statut?"selected":""}>${s}</option>`).join("")}
      </select>
    </div>`).join("") || "<p>Aucune commande.</p>";
}
$("connexion").onclick = async () => {
  const { error } = await db.auth.signInWithPassword({ email:$("email").value, password:$("mdp").value });
  if(error) return alert("Connexion refusée");
  ouvrirAdmin();
};
$("deco").onclick = async () => { await db.auth.signOut(); location.hash = ""; location.reload(); };
$("ajouter").onclick = async () => {
  const f = $("photo").files[0]; let url = null;
  if(f){
    const chemin = Date.now() + "-" + f.name.replace(/[^a-z0-9.]/gi, "_");
    const { error } = await db.storage.from("photos").upload(chemin, f);
    if(error) return alert("Upload de la photo raté");
    url = db.storage.from("photos").getPublicUrl(chemin).data.publicUrl;
  }
  const { error } = await db.from("produits").insert({
    nom:$("pnom").value, prix:parseFloat($("pprix").value),
    categorie:$("pcat").value, description:$("pdesc").value, image_url:url
  });
  if(error) return alert("Erreur : " + error.message);
  ["pnom","pprix","pdesc","photo"].forEach(id => $(id).value = "");
  chargerProduits();
};

/* ---------- Événements ---------- */
document.addEventListener("click", async e => {
  const t = e.target;
  if(t.dataset.cat){ cat = t.dataset.cat; afficherCats(); afficher(); }
  if(t.dataset.add){
    const p = produits.find(x => x.id == t.dataset.add);
    const l = panier.find(x => x.id == p.id);
    if(l) l.qty++; else panier.push({ id:p.id, nom:p.nom, prix:Number(p.prix), qty:1 });
    sauver();
  }
  if(t.dataset.plus) changer(t.dataset.plus, 1);
  if(t.dataset.moins) changer(t.dataset.moins, -1);
  if(t.dataset.del && confirm("Supprimer ce modèle ?")){
    await db.from("produits").delete().eq("id", t.dataset.del); chargerProduits(); charger();
  }
});
document.addEventListener("change", async e => {
  if(e.target.dataset.statut){
    await db.from("commandes").update({ statut:e.target.value }).eq("id", e.target.dataset.statut);
  }
});
$("q").addEventListener("input", () => { if(!$("catalogue").hidden) afficher(); else show("catalogue"), afficher(); });
$("btnPanier").onclick = () => show("commande");
$("retour").onclick = $("retour2").onclick = () => show("catalogue");
$("envoyer").onclick = envoyer;
window.addEventListener("hashchange", () => location.hash === "#admin" ? ouvrirAdmin() : show("catalogue"));

afficherCats(); majPanier(); charger();
if(location.hash === "#admin") ouvrirAdmin(); else show("catalogue");
</script>
</body>
</html>
